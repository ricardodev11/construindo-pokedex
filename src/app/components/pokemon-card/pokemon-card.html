<li>
  <a
    class="pokemon-card"
    [routerLink]="['/pokemon', pokemon().id]"
    [attr.aria-label]="'Ver detalhes de ' + pokemon().name"
  >
    <span class="pokemon-card__id">#{{ pokemon().formattedId }}</span>

    @if (!imageFailed()) {
      <img
        class="pokemon-card__image"
        [src]="pokemon().imageUrl"
        [alt]="'Ilustração oficial de ' + pokemon().name"
        loading="lazy"
        (error)="imageFailed.set(true)"
      />
    }

    <span class="pokemon-card__name">{{ pokemon().name }}</span>
  </a>

  <button
    type="button"
    class="pokemon-card__fav"
    [class.pokemon-card__fav--active]="favorite()"
    [attr.aria-label]="favorite() ? 'Remover ' + pokemon().name + ' dos favoritos' : 'Favoritar ' + pokemon().name"
    (click)="toggleFavorite.emit(pokemon())"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
    </svg>
  </button>
</li>
